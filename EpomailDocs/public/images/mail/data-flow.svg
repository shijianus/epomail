<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="100%" height="100%" style="background:#0b0f19; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,'PingFang SC','Microsoft YaHei',sans-serif;">
  <defs>
    <linearGradient id="grad-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="grad-teal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="grad-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="grad-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="grad-violet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#d946ef" />
    </linearGradient>
    <linearGradient id="card-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3b82f6" />
    </marker>
    <filter id="drop-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1000" height="640" fill="#090d16" />

  <text x="50" y="50" fill="#f8fafc" font-size="24" font-weight="700" letter-spacing="-0.5">EpoCanvas Mail 数据流与数据边界</text>
  <text x="50" y="76" fill="#94a3b8" font-size="13">邮件数据静态存放在实例自己的 Cloudflare 资源内；只有右侧三个「带开关」通道会把数据送出实例，且各有明确触发条件</text>

  <!-- Band 1: 浏览器 → Worker -->
  <g transform="translate(50, 104)" filter="url(#drop-shadow)">
    <rect width="900" height="150" rx="12" fill="url(#card-bg)" stroke="#334155" stroke-width="1.2" />
    <rect x="0" y="0" width="6" height="150" rx="3" fill="url(#grad-accent)" />
    <text x="30" y="30" fill="#60a5fa" font-size="12" font-weight="700" letter-spacing="1">① 访问层 · 您的浏览器 ↔ Cloudflare Worker（HTTPS/TLS 加密传输）</text>

    <rect x="30" y="48" width="200" height="82" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-opacity="0.45" />
    <text x="130" y="80" fill="#f8fafc" font-size="14" font-weight="700" text-anchor="middle">您的浏览器</text>
    <text x="130" y="102" fill="#94a3b8" font-size="11" text-anchor="middle">JWT 会话存于 localStorage</text>
    <text x="130" y="118" fill="#64748b" font-size="10.5" text-anchor="middle">本服务不使用 Cookie · 无跨站追踪</text>

    <line x1="238" y1="89" x2="316" y2="89" stroke="#3b82f6" stroke-width="1.6" marker-end="url(#arrow-blue)" marker-start="url(#arrow-blue)" />
    <text x="277" y="78" fill="#60a5fa" font-size="10.5" text-anchor="middle">HTTPS</text>

    <rect x="324" y="48" width="238" height="82" rx="8" fill="#1e293b" stroke="#8b5cf6" stroke-opacity="0.45" />
    <text x="443" y="76" fill="#f8fafc" font-size="14" font-weight="700" text-anchor="middle">EpoCanvas Mail Worker</text>
    <text x="443" y="98" fill="#94a3b8" font-size="11" text-anchor="middle">网页端 · 开放 API · 邮件处理</text>
    <text x="443" y="116" fill="#64748b" font-size="10.5" text-anchor="middle">开源代码 · 全部逻辑可审计</text>

    <line x1="570" y1="89" x2="648" y2="89" stroke="#3b82f6" stroke-width="1.6" marker-end="url(#arrow-blue)" marker-start="url(#arrow-blue)" />
    <text x="609" y="78" fill="#60a5fa" font-size="10.5" text-anchor="middle">读写</text>

    <rect x="656" y="48" width="214" height="82" rx="8" fill="#1e293b" stroke="#64748b" stroke-opacity="0.5" />
    <text x="763" y="72" fill="#f8fafc" font-size="12.5" font-weight="700" text-anchor="middle">Cloudflare 基础设施</text>
    <text x="763" y="92" fill="#94a3b8" font-size="11" text-anchor="middle">D1 数据库 · KV 缓存 · R2 附件</text>
    <text x="763" y="110" fill="#64748b" font-size="10.5" text-anchor="middle">Turnstile 人机验证 · 边缘日志</text>
  </g>

  <!-- Band 2: 存储与加密 -->
  <g transform="translate(50, 274)" filter="url(#drop-shadow)">
    <rect width="560" height="170" rx="12" fill="url(#card-bg)" stroke="#334155" stroke-width="1.2" />
    <rect x="0" y="0" width="6" height="170" rx="3" fill="url(#grad-emerald)" />
    <text x="30" y="30" fill="#34d399" font-size="12" font-weight="700" letter-spacing="1">② 存储层 · 数据静态存放在您（或运营者）的 Cloudflare 账号内</text>

    <rect x="30" y="48" width="160" height="52" rx="8" fill="#1e293b" stroke="#10b981" stroke-opacity="0.4" />
    <text x="110" y="70" fill="#f8fafc" font-size="12" font-weight="700" text-anchor="middle">D1 (SQLite)</text>
    <text x="110" y="88" fill="#94a3b8" font-size="10.5" text-anchor="middle">用户 · 邮件 · 设置</text>

    <rect x="30" y="108" width="160" height="44" rx="8" fill="#1e293b" stroke="#10b981" stroke-opacity="0.4" />
    <text x="110" y="128" fill="#f8fafc" font-size="12" font-weight="700" text-anchor="middle">KV</text>
    <text x="110" y="144" fill="#94a3b8" font-size="10.5" text-anchor="middle">会话 · 资料 · 兜底附件</text>

    <rect x="200" y="48" width="160" height="52" rx="8" fill="#1e293b" stroke="#10b981" stroke-opacity="0.4" />
    <text x="280" y="70" fill="#f8fafc" font-size="12" font-weight="700" text-anchor="middle">R2 / S3 / B2</text>
    <text x="280" y="88" fill="#94a3b8" font-size="10.5" text-anchor="middle">附件二进制文件</text>

    <rect x="200" y="108" width="160" height="44" rx="8" fill="#0f172a" stroke="#f59e0b" stroke-opacity="0.45" />
    <text x="280" y="128" fill="#fbbf24" font-size="11.5" font-weight="700" text-anchor="middle">密码 PBKDF2 ×100,000</text>
    <text x="280" y="144" fill="#94a3b8" font-size="10.5" text-anchor="middle">TOTP 密钥 AES-256-GCM</text>

    <rect x="372" y="48" width="164" height="104" rx="8" fill="#0f172a" stroke="#64748b" stroke-opacity="0.5" />
    <text x="454" y="72" fill="#f8fafc" font-size="11.5" font-weight="700" text-anchor="middle">三种邮件模式</text>
    <text x="454" y="92" fill="#94a3b8" font-size="10.5" text-anchor="middle">全部邮件：明文</text>
    <text x="454" y="110" fill="#94a3b8" font-size="10.5" text-anchor="middle">隐私：正文 AES-256-GCM</text>
    <text x="454" y="128" fill="#94a3b8" font-size="10.5" text-anchor="middle">加密：含垃圾箱全加密</text>
    <text x="454" y="146" fill="#fbbf24" font-size="9.5" text-anchor="middle">服务端加密 ≠ 端到端加密</text>
  </g>

  <!-- Band 3: 出站与外呼通道 -->
  <g transform="translate(640, 274)" filter="url(#drop-shadow)">
    <rect width="310" height="170" rx="12" fill="url(#card-bg)" stroke="#334155" stroke-width="1.2" />
    <rect x="0" y="0" width="6" height="170" rx="3" fill="url(#grad-amber)" />
    <text x="28" y="30" fill="#fbbf24" font-size="12" font-weight="700" letter-spacing="1">③ 出站通道（带开关）</text>

    <rect x="28" y="46" width="254" height="34" rx="7" fill="#1e293b" stroke="#f59e0b" stroke-opacity="0.4" />
    <text x="40" y="68" fill="#f8fafc" font-size="11.5" font-weight="700">Resend / Mailjet · 站外投递</text>
    <text x="288" y="68" fill="#fbbf24" font-size="10" text-anchor="end">发站外信时</text>

    <rect x="28" y="88" width="254" height="34" rx="7" fill="#1e293b" stroke="#f59e0b" stroke-opacity="0.4" />
    <text x="40" y="110" fill="#f8fafc" font-size="11.5" font-weight="700">Telegram · 主题/正文/验证码推送</text>
    <text x="288" y="110" fill="#fbbf24" font-size="10" text-anchor="end">绑定后</text>

    <rect x="28" y="130" width="254" height="30" rx="7" fill="#1e293b" stroke="#f59e0b" stroke-opacity="0.4" />
    <text x="40" y="150" fill="#f8fafc" font-size="11.5" font-weight="700">AI 翻译 · 文本/图片外发</text>
    <text x="288" y="150" fill="#fbbf24" font-size="10" text-anchor="end">点击翻译时</text>
  </g>

  <!-- Band 4: 外部服务去向 -->
  <g transform="translate(50, 464)" filter="url(#drop-shadow)">
    <rect width="900" height="146" rx="12" fill="url(#card-bg)" stroke="#334155" stroke-width="1.2" />
    <rect x="0" y="0" width="6" height="146" rx="3" fill="url(#grad-violet)" />
    <text x="30" y="30" fill="#c084fc" font-size="12" font-weight="700" letter-spacing="1">④ 数据最终去向 · 全部第三方处理者一览（无广告、无统计、不出售）</text>

    <rect x="30" y="46" width="200" height="40" rx="7" fill="#1e293b" stroke="#8b5cf6" stroke-opacity="0.4" />
    <text x="130" y="64" fill="#f8fafc" font-size="11" font-weight="700" text-anchor="middle">AI 中继端点（OpenAI 兼容）</text>
    <text x="130" y="79" fill="#94a3b8" font-size="9.5" text-anchor="middle">被翻译的文本片段</text>

    <rect x="240" y="46" width="200" height="40" rx="7" fill="#1e293b" stroke="#8b5cf6" stroke-opacity="0.4" />
    <text x="340" y="64" fill="#f8fafc" font-size="11" font-weight="700" text-anchor="middle">Cloudflare Workers AI</text>
    <text x="340" y="79" fill="#94a3b8" font-size="9.5" text-anchor="middle">验证码提取 · 翻译兜底 · OCR</text>

    <rect x="450" y="46" width="200" height="40" rx="7" fill="#1e293b" stroke="#8b5cf6" stroke-opacity="0.4" />
    <text x="550" y="64" fill="#f8fafc" font-size="11" font-weight="700" text-anchor="middle">MyMemory / Google 翻译</text>
    <text x="550" y="79" fill="#94a3b8" font-size="9.5" text-anchor="middle">兜底公共翻译接口</text>

    <rect x="660" y="46" width="210" height="40" rx="7" fill="#1e293b" stroke="#8b5cf6" stroke-opacity="0.4" />
    <text x="765" y="64" fill="#f8fafc" font-size="11" font-weight="700" text-anchor="middle">图片上传服务 · Linux DO</text>
    <text x="765" y="79" fill="#94a3b8" font-size="9.5" text-anchor="middle">头像文件 · 第三方登录身份</text>

    <rect x="30" y="96" width="200" height="36" rx="7" fill="#1e293b" stroke="#64748b" stroke-opacity="0.4" />
    <text x="130" y="118" fill="#f8fafc" font-size="11" font-weight="700" text-anchor="middle">Google Fonts</text>
    <text x="240" y="112" fill="#64748b" font-size="9.5">← 界面字体请求</text>

    <rect x="240" y="96" width="200" height="36" rx="7" fill="#1e293b" stroke="#64748b" stroke-opacity="0.4" />
    <text x="340" y="118" fill="#f8fafc" font-size="11" font-weight="700" text-anchor="middle">Cloudflare Email Routing</text>
    <text x="450" y="112" fill="#64748b" font-size="9.5">← 入站邮件接收</text>

    <rect x="450" y="96" width="200" height="36" rx="7" fill="#1e293b" stroke="#64748b" stroke-opacity="0.4" />
    <text x="550" y="118" fill="#f8fafc" font-size="11" font-weight="700" text-anchor="middle">S3 / B2 / Turso（可选）</text>
    <text x="660" y="112" fill="#64748b" font-size="9.5">← 自带外部存储</text>

    <rect x="660" y="96" width="210" height="36" rx="7" fill="#0f172a" stroke="#f59e0b" stroke-opacity="0.4" />
    <text x="765" y="112" fill="#fbbf24" font-size="10.5" font-weight="700" text-anchor="middle">欢迎邮件 / 全站公告</text>
    <text x="765" y="127" fill="#94a3b8" font-size="9.5" text-anchor="middle">admin@epocanvas.com 站内直投 · 不出外网</text>
  </g>

  <!-- 底部图例 -->
  <g transform="translate(50, 622)">
    <circle cx="6" cy="0" r="4" fill="#3b82f6" /><text x="16" y="3.5" fill="#94a3b8" font-size="10.5">站内传输（加密）</text>
    <circle cx="130" cy="0" r="4" fill="#f59e0b" /><text x="140" y="3.5" fill="#94a3b8" font-size="10.5">按需触发的出站通道</text>
    <circle cx="280" cy="0" r="4" fill="#8b5cf6" /><text x="290" y="3.5" fill="#94a3b8" font-size="10.5">第三方处理者</text>
    <circle cx="390" cy="0" r="4" fill="#10b981" /><text x="400" y="3.5" fill="#94a3b8" font-size="10.5">实例内存储</text>
    <text x="900" y="3.5" fill="#475569" font-size="10" text-anchor="end">EpoCanvas Mail · Privacy</text>
  </g>
</svg>
