<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="100%" height="100%" style="background:#0b0f19; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,'PingFang SC','Microsoft YaHei',sans-serif;">
  <defs>
    <linearGradient id="grad-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="grad-teal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="grad-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="grad-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="card-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3b82f6" />
    </marker>
    <filter id="drop-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1000" height="620" fill="#090d16" />

  <text x="50" y="50" fill="#f8fafc" font-size="24" font-weight="700" letter-spacing="-0.5">EpoCanvas Mail：开源身份与责任边界</text>
  <text x="50" y="76" fill="#94a3b8" font-size="13">软件是工具，运营者才是「我们」——从源代码到您的邮箱，责任如何逐层传导</text>

  <!-- Band 1: 上游开源项目 -->
  <g transform="translate(50, 104)" filter="url(#drop-shadow)">
    <rect width="900" height="120" rx="12" fill="url(#card-bg)" stroke="#334155" stroke-width="1.2" />
    <rect x="0" y="0" width="6" height="120" rx="3" fill="url(#grad-accent)" />
    <text x="30" y="30" fill="#60a5fa" font-size="12" font-weight="700" letter-spacing="1">① 上游开源项目 · GitHub（MIT License）</text>

    <rect x="30" y="44" width="255" height="60" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-opacity="0.4" />
    <text x="157" y="68" fill="#f8fafc" font-size="12" font-weight="700" text-anchor="middle">MIT 许可证 · Copyright (c) 2025 eoao</text>
    <text x="157" y="88" fill="#94a3b8" font-size="10.5" text-anchor="middle">源代码 100% 公开 · 任何人可审计</text>

    <rect x="305" y="44" width="255" height="60" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-opacity="0.4" />
    <text x="432" y="68" fill="#f8fafc" font-size="12" font-weight="700" text-anchor="middle">零遥测 · 零统计 · 零广告 SDK</text>
    <text x="432" y="88" fill="#94a3b8" font-size="10.5" text-anchor="middle">软件本身不收集、不上传任何数据</text>

    <rect x="580" y="44" width="290" height="60" rx="8" fill="#0f172a" stroke="#64748b" stroke-opacity="0.5" />
    <text x="725" y="68" fill="#f8fafc" font-size="12" font-weight="700" text-anchor="middle">不运营任何邮箱服务</text>
    <text x="725" y="88" fill="#94a3b8" font-size="10.5" text-anchor="middle">不为任何实例的用户数据与行为负责</text>
  </g>

  <!-- 箭头：部署 -->
  <g transform="translate(50, 224)">
    <line x1="225" y1="0" x2="225" y2="46" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#arrow-blue)" />
    <text x="238" y="28" fill="#60a5fa" font-size="11">部署（Workers + D1 + KV + R2）</text>
    <line x1="675" y1="46" x2="675" y2="0" stroke="#64748b" stroke-width="1.4" stroke-dasharray="4 4" marker-end="url(#arrow)" />
    <text x="580" y="28" fill="#64748b" font-size="11">「软件不上报数据」↑ 无任何回传通道</text>
  </g>

  <!-- Band 2: 实例运营者 -->
  <g transform="translate(50, 274)" filter="url(#drop-shadow)">
    <rect width="900" height="150" rx="12" fill="url(#card-bg)" stroke="#f59e0b" stroke-width="1.2" />
    <rect x="0" y="0" width="6" height="150" rx="3" fill="url(#grad-amber)" />
    <text x="30" y="30" fill="#fbbf24" font-size="12" font-weight="700" letter-spacing="1">② 您所使用的实例（mail.epocanvas.com 或任意自建域名）</text>

    <rect x="30" y="46" width="410" height="88" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-opacity="0.4" />
    <text x="235" y="72" fill="#f8fafc" font-size="13" font-weight="700" text-anchor="middle">实例运营者 = 您的数据「数据控制者」</text>
    <text x="235" y="94" fill="#94a3b8" font-size="11" text-anchor="middle">决定邮件模式（全部 / 隐私 / 加密）与注册策略</text>
    <text x="235" y="114" fill="#94a3b8" font-size="11" text-anchor="middle">对收集目的、保留期限、删除请求承担法律责任</text>
    <text x="235" y="130" fill="#64748b" font-size="10" text-anchor="middle">数据保存在其自己的 Cloudflare 账号内</text>

    <rect x="460" y="46" width="410" height="88" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-opacity="0.4" />
    <text x="665" y="72" fill="#f8fafc" font-size="13" font-weight="700" text-anchor="middle">运营者的管理边界（如实披露）</text>
    <text x="665" y="94" fill="#94a3b8" font-size="11" text-anchor="middle">全部邮件模式：可读全部邮件</text>
    <text x="665" y="114" fill="#94a3b8" font-size="11" text-anchor="middle">隐私模式：仅垃圾 / 已删 / 无主邮件</text>
    <text x="665" y="130" fill="#fbbf24" font-size="10" text-anchor="middle">加密模式：后台不返回用户邮件（密钥仍在服务器侧）</text>
  </g>

  <!-- 箭头：服务 -->
  <g transform="translate(50, 424)">
    <line x1="450" y1="0" x2="450" y2="40" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#arrow-blue)" />
    <text x="462" y="24" fill="#60a5fa" font-size="11">提供邮件服务 · 隐私政策与服务条款适用</text>
  </g>

  <!-- Band 3: 您（用户） -->
  <g transform="translate(50, 468)" filter="url(#drop-shadow)">
    <rect width="900" height="118" rx="12" fill="url(#card-bg)" stroke="#334155" stroke-width="1.2" />
    <rect x="0" y="0" width="6" height="118" rx="3" fill="url(#grad-emerald)" />
    <text x="30" y="30" fill="#34d399" font-size="12" font-weight="700" letter-spacing="1">③ 您（用户）· 账号与邮件的所有权人</text>

    <rect x="30" y="44" width="205" height="58" rx="8" fill="#1e293b" stroke="#10b981" stroke-opacity="0.4" />
    <text x="132" y="68" fill="#f8fafc" font-size="11.5" font-weight="700" text-anchor="middle">您的邮件归您</text>
    <text x="132" y="88" fill="#94a3b8" font-size="10.5" text-anchor="middle">不为广告与训练所使用</text>

    <rect x="255" y="44" width="205" height="58" rx="8" fill="#1e293b" stroke="#10b981" stroke-opacity="0.4" />
    <text x="357" y="68" fill="#f8fafc" font-size="11.5" font-weight="700" text-anchor="middle">导出权 · JSON 一键导出</text>
    <text x="357" y="88" fill="#94a3b8" font-size="10.5" text-anchor="middle">资料 + 全部未删邮件</text>

    <rect x="480" y="44" width="205" height="58" rx="8" fill="#1e293b" stroke="#10b981" stroke-opacity="0.4" />
    <text x="582" y="68" fill="#f8fafc" font-size="11.5" font-weight="700" text-anchor="middle">删除权 · 被遗忘权</text>
    <text x="582" y="88" fill="#94a3b8" font-size="10.5" text-anchor="middle">单删 / 注销 / 物理删除</text>

    <rect x="705" y="44" width="165" height="58" rx="8" fill="#1e293b" stroke="#10b981" stroke-opacity="0.4" />
    <text x="787" y="68" fill="#f8fafc" font-size="11.5" font-weight="700" text-anchor="middle">安全自主权</text>
    <text x="787" y="88" fill="#94a3b8" font-size="10.5" text-anchor="middle">2FA · Passkey · 会话吊销</text>
  </g>

  <!-- 底部图例 -->
  <g transform="translate(50, 606)">
    <circle cx="6" cy="0" r="4" fill="#3b82f6" /><text x="16" y="3.5" fill="#94a3b8" font-size="10.5">代码 / 部署流向</text>
    <circle cx="140" cy="0" r="4" fill="#f59e0b" /><text x="150" y="3.5" fill="#94a3b8" font-size="10.5">责任主体（数据控制者）</text>
    <circle cx="300" cy="0" r="4" fill="#10b981" /><text x="310" y="3.5" fill="#94a3b8" font-size="10.5">用户权利</text>
    <text x="900" y="3.5" fill="#475569" font-size="10" text-anchor="end">自托管即成为运营者 · 本图适用于任何 EpoCanvas Mail 实例</text>
  </g>
</svg>
