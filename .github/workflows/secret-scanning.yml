name: Offline Secret Scanning Gate

on:
  push:
    branches:
      - 'main'
      - 'master'
      - 'review/**'
  pull_request:
    branches:
      - 'main'
      - 'master'
      - 'review/**'

permissions:
  contents: read

jobs:
  offline-scan:
    name: Offline Credential & Fixture Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run Scanner Self-Test
        run: node scripts/scan-staged-secrets.mjs --self-test

      - name: Scan Head Commit Diff
        run: |
          node -e '
            import { execSync } from "node:child_process";
            import { scanContent } from "./scripts/scan-staged-secrets.mjs";
            const diff = execSync("git diff HEAD~1 HEAD --unified=0", { encoding: "utf-8" });
            const added = diff.split("\n").filter(l => l.startsWith("+") && !l.startsWith("+++")).map(l => l.substring(1)).join("\n");
            const findings = scanContent(added, "commit-diff");
            if (findings.length > 0) {
              console.error("❌ Detected hardcoded credentials in commit diff:");
              findings.forEach(f => console.error(`  - [${f.ruleId}] ${f.file}:${f.line} (${f.matchedMasked})`));
              process.exit(1);
            }
            console.log("✅ Offline commit diff scan passed with 0 findings.");
          '
