name: Offline Secret Scanning Gate

on:
  push:
    branches:
      - 'main'
      - 'master'
      - 'review/**'
      - 'release/**'
  pull_request:
    branches:
      - 'main'
      - 'master'
      - 'review/**'
      - 'release/**'

permissions:
  contents: read

jobs:
  offline-scan:
    name: Offline Credential & Fixture Gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # 完整历史：覆盖一次 push 的全部新增提交与 PR merge-base 计算，
          # 不再只比较 HEAD~1..HEAD（那会漏掉同一次 push 中的其他提交）
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 22

      - name: Run Scanner Self-Test
        run: node scripts/scan-staged-secrets.mjs --self-test

      - name: Scan Push Range (all new commits in this push)
        if: github.event_name == 'push'
        run: node scripts/scan-staged-secrets.mjs --push "${{ github.event.before }}" "${{ github.sha }}"

      - name: Scan PR Range (merge-base based, all PR commits)
        if: github.event_name == 'pull_request'
        run: node scripts/scan-staged-secrets.mjs --pr "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"

      - name: Install gitleaks (verified checksum)
        id: gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz -o /tmp/gitleaks.tgz
          echo "9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c  /tmp/gitleaks.tgz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          sudo install /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      # gitleaks v8 removed the v7 `log` subcommand; `git` is the supported
      # history scanner (`log` exits 1 with "unknown command", failing this gate
      # on every push where the download succeeds).
      - name: Scan Push Range with gitleaks (all new commits)
        if: github.event_name == 'push'
        run: |
          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            # A brand-new branch has no parent range; scan the whole history
            # rather than skipping the gate.
            gitleaks git --no-banner --redact --log-opts="--all" \
              || { echo "::error::gitleaks found secrets in repository history"; exit 1; }
          else
            gitleaks git --no-banner --redact --log-opts="${BEFORE}..${{ github.sha }}" \
              || { echo "::error::gitleaks found secrets in push range"; exit 1; }
          fi

      - name: Scan PR Range with gitleaks (merge-base based)
        if: github.event_name == 'pull_request'
        run: |
          BASE=$(git merge-base "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}")
          gitleaks git --no-banner --redact --log-opts="${BASE}..${{ github.event.pull_request.head.sha }}" || { echo "::error::gitleaks found secrets in PR range"; exit 1; }
