name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  actions: read

jobs:
  release:
    name: Publish verified GitHub Release
    if: github.event.deleted == false
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve release scope and verify acceptance for the tagged commit
        id: gates
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const { releaseKind, requireTagReleaseChecks } = require('./scripts/lib/release-workflows.cjs');
            const sha = (await exec.getExecOutput('git', ['rev-parse', 'HEAD'])).stdout.trim();
            const kind = releaseKind(process.env.GITHUB_REF_NAME);
            const run = await requireTagReleaseChecks(github, context.repo, sha, kind);
            core.info(run.html_url);
            core.setOutput('sha', sha);
            core.setOutput('run', String(run.id));
            core.setOutput('attempt', String(run.run_attempt));
            if (kind !== 'source-rc') {
              core.setOutput('package', `public-beta-package-${sha}-${run.run_attempt}`);
            }
            core.setOutput('kind', kind);

      - name: Download the previously accepted package
        if: steps.gates.outputs.kind != 'source-rc'
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4.1.9
        with:
          name: ${{ steps.gates.outputs.package }}
          path: ${{ runner.temp }}/release-package
          github-token: ${{ github.token }}
          run-id: ${{ steps.gates.outputs.run }}

      - name: Verify downloaded release bytes and source commit
        if: steps.gates.outputs.kind != 'source-rc'
        shell: bash
        run: |
          set -euo pipefail
          package="$RUNNER_TEMP/release-package"
          (cd "$package" && sha256sum epomail-candidate.tar.gz | cmp - epomail-candidate.tar.gz.sha256)
          test "$(tar -xOzf "$package/epomail-candidate.tar.gz" ./SOURCE_SHA)" = "$(git rev-parse HEAD)"

      - name: Recheck the selected run, push checks and tag before publication
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        env:
          RELEASE_SHA: ${{ steps.gates.outputs.sha }}
          RELEASE_KIND: ${{ steps.gates.outputs.kind }}
          SELECTED_RUN: ${{ steps.gates.outputs.run }}
          SELECTED_ATTEMPT: ${{ steps.gates.outputs.attempt }}
        with:
          script: |
            const { requireTagReleaseChecks, requireTagCommit } = require('./scripts/lib/release-workflows.cjs');
            const sha = process.env.RELEASE_SHA;
            await requireTagReleaseChecks(github, context.repo, sha, process.env.RELEASE_KIND, {
              id: process.env.SELECTED_RUN, attempt: process.env.SELECTED_ATTEMPT
            });
            await requireTagCommit(github, context.repo, process.env.GITHUB_REF_NAME, sha);

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_KIND: ${{ steps.gates.outputs.kind }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RELEASE_KIND" == source-rc ]]; then
            gh release create "$RELEASE_TAG" --verify-tag --title "EpoMail $RELEASE_TAG (source candidate)" \
              --notes "This release publishes the source candidate for review and testing." --prerelease
          else
            package="$RUNNER_TEMP/release-package"
            flag=--prerelease
            if [[ "$RELEASE_KIND" == stable ]]; then flag=--latest; fi
            gh release create "$RELEASE_TAG" --verify-tag --title "EpoMail $RELEASE_TAG" --notes-file RELEASE_NOTES.md "$flag" \
              "$package/epomail-candidate.tar.gz" "$package/epomail-candidate.tar.gz.sha256"
          fi
