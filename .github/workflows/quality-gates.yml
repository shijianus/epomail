name: Quality Gates

# 工程化质量门禁：类型检查 / 单元测试 / 浏览器回归 / 构建 / Worker dry-run / i18n / 密钥 / 差异规范。
# 与既有 security.yml、secret-scanning.yml 并存且互不替代：
#   - security.yml           仍是密钥与安全测试的权威门禁（未做任何改动）
#   - secret-scanning.yml    仍是提交范围与 gitleaks 的权威门禁（未做任何改动）
# 本工作流只新增或复用校验，不下调任何既有要求。

on:
  push:
    branches:
      - master
      - main
      - 'review/**'
      - 'release/**'
  pull_request:
    branches:
      - master
      - main
      - 'review/**'
      - 'release/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-gates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # 固定补丁版本：本地验证与 CI 使用同一 Node / pnpm，避免次版本漂移引入差异。
  NODE_VERSION: '24.14.0'
  PNPM_VERSION: '10.34.5'

jobs:
  diff-hygiene:
    name: Diff hygiene (whitespace & conflict markers)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve diff range
        id: range
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "range=${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            echo "range=${{ github.event.before }}..${{ github.sha }}" >> "$GITHUB_OUTPUT"
          else
            # 新分支首次 push 没有 before，退化为单提交比较
            echo "range=HEAD^..HEAD" >> "$GITHUB_OUTPUT"
          fi

      - name: Check whitespace errors and conflict markers
        shell: bash
        run: |
          echo "检查范围: ${{ steps.range.outputs.range }}"
          # git diff --check 会在行尾空白与残留冲突标记（<<<<<<< / >>>>>>>）处报错并返回非零
          git diff --check "${{ steps.range.outputs.range }}"

  secret-scan:
    name: Secret scan (working tree)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Scan working tree
        run: node scripts/secret-scan.mjs

  i18n:
    name: i18n gates (6-language dictionaries)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Dictionary key symmetry (mail-vue + mail-worker)
        run: node scripts/i18n-symmetry.mjs

      - name: Literal key coverage (mail-vue)
        run: node scripts/i18n-audit.mjs

      - name: Hardcoded visible text audit (mail-vue)
        run: node scripts/i18n-hardcoded.mjs

      - name: Login sub-app dictionary gate (symmetry / duplicates / missing / code refs)
        run: node scripts/i18n-auth-locale.mjs

  login-ui:
    name: Login UI (typecheck + unit tests + build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: temp_login_ui/pnpm-lock.yaml

      - name: Install dependencies (frozen lockfile)
        run: pnpm --dir temp_login_ui install --frozen-lockfile

      - name: TypeScript typecheck (tsc --noEmit)
        run: pnpm --dir temp_login_ui run typecheck

      - name: Node unit tests
        run: pnpm --dir temp_login_ui test

      - name: Vite production build
        run: pnpm --dir temp_login_ui run build

      - name: Upload built login bundle
        uses: actions/upload-artifact@v4
        with:
          name: login-dist
          path: temp_login_ui/dist
          retention-days: 1
          if-no-files-found: error

  login-ui-e2e:
    name: Login UI OAuth browser regression (Playwright, local only)
    needs: login-ui
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install Playwright runtime (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Download built login bundle
        uses: actions/download-artifact@v4
        with:
          name: login-dist
          path: temp_login_ui/dist

      # 该用例在 127.0.0.1 起本地静态服务器，并用 page.route 拦截全部 /api/** 请求，
      # 全程不触碰任何真实后端或生产 API，也不需要任何凭据。
      - name: Run OAuth bind/login browser scenarios
        run: node tests/oauth-bind-login-ui-e2e.mjs

  worker:
    name: Worker (full test suite + deploy dry-run)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: mail-worker/pnpm-lock.yaml

      - name: Install dependencies (frozen lockfile)
        run: pnpm --dir mail-worker install --frozen-lockfile

      - name: Worker test suite
        run: pnpm --dir mail-worker test

      # wrangler.toml 的 [build] 钩子会执行 scripts/build-prod.mjs（先 temp_login_ui 后 mail-vue），
      # 因此该步骤同时验证了真实部署路径的可构建性；dry-run 不连接 Cloudflare 账户、不上传任何产物。
      - name: Wrangler deploy dry-run
        working-directory: mail-worker
        run: pnpm exec wrangler deploy --dry-run --outdir "$RUNNER_TEMP/worker-dry-run"

  mail-vue-build:
    name: mail-vue production build
    needs: login-ui
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: mail-vue/pnpm-lock.yaml

      # mail-vue 的 build 会调用 scripts/copy-login-dist.mjs，必须拿到 temp_login_ui 的产物
      - name: Download built login bundle
        uses: actions/download-artifact@v4
        with:
          name: login-dist
          path: temp_login_ui/dist

      - name: Install dependencies (frozen lockfile)
        run: pnpm --dir mail-vue install --frozen-lockfile

      - name: Vite production build
        run: pnpm --dir mail-vue run build
