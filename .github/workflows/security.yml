name: Security Audit

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret scan (working tree + history)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Scan current tree
        run: node scripts/secret-scan.mjs

      - name: Scan all reachable git history
        run: node scripts/secret-scan.mjs --history --baseline .secret-scan-baseline.json

  worker-tests:
    name: Worker security tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: mail-worker/pnpm-lock.yaml

      - name: Install worker dependencies
        run: pnpm --dir mail-worker install --frozen-lockfile

      - name: Run worker test suite
        run: pnpm --dir mail-worker test

      - name: i18n symmetry
        run: node scripts/i18n-symmetry.mjs

      - name: i18n literal coverage
        run: node scripts/i18n-audit.mjs

      - name: i18n hardcoded text audit
        run: node scripts/i18n-hardcoded.mjs
