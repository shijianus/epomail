name: Security Audit

on:
  push:
    branches: [master, 'release/**']
  pull_request:
    branches: [master, 'release/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret scan (working tree + history)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout full history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 22

      - name: Scan current tree
        run: node scripts/secret-scan.mjs

      - name: Scan all reachable git history
        run: node scripts/secret-scan.mjs --history --baseline .secret-scan-baseline.json

  worker-tests:
    name: Worker security tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup pnpm
        uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
        with:
          version: 10.34.5

      - name: Setup Node
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: '24.14.0'
          cache: pnpm
          cache-dependency-path: mail-worker/pnpm-lock.yaml

      - name: Install worker dependencies
        run: pnpm --dir mail-worker install --frozen-lockfile

      - name: Worker dependency security audit
        run: pnpm --dir mail-worker audit --registry=https://registry.npmjs.org --prod --audit-level=high

      - name: Run worker test suite
        run: pnpm --dir mail-worker test

      - name: i18n symmetry
        run: node scripts/i18n-symmetry.mjs

      - name: i18n literal coverage
        run: node scripts/i18n-audit.mjs

      - name: i18n hardcoded text audit
        run: node scripts/i18n-hardcoded.mjs
