name = "epomail"
main = "src/index.js"
compatibility_date = "2025-06-04"
keep_vars = true

[observability]
enabled = true

# --------------------------------------------------------------------------------------
# 数据库存储绑定 (D1 Databases Configuration)
# --------------------------------------------------------------------------------------
# 【模式 1: 单数据库模式 (默认 / 推荐标准部署)】
# 所有用户数据与邮件数据集中存放在同一个 D1 数据库中，开箱即用：
[[d1_databases]]
binding = "db"
database_name = "epomail"
database_id = "542cbca1-fce5-41c5-93f2-c1d04fa919e8"

# 【模式 2: 双数据库物理分离模式 (可选 / 面向海量邮件与核心用户隔离部署)】
# 若需将邮件流转数据与用户身份/2FA/OAuth应用凭据物理隔离，可解除下方注释并配置对应 D1 ID（系统将自动启用双库路由）：
# 1) USER_DB: 存放用户账号、密码哈希、2FA密钥、Passkeys、RBAC权限、系统设置与OAuth开放平台数据
# [[d1_databases]]
# binding = "USER_DB"
# database_name = "epomail_user"
# database_id = "your-user-d1-database-id"
#
# 2) MAIL_DB: 存放邮件列表、正文详情、收发号池、星标收藏与附件元数据
# [[d1_databases]]
# binding = "MAIL_DB"
# database_name = "epomail_mail"
# database_id = "your-mail-d1-database-id"

[[kv_namespaces]]
binding = "kv"
id = "e708c64d291e42c3a03b896914d42575"

#[[r2_buckets]]
#binding = "r2"			#r2对象存储绑定名默认不可修改
#bucket_name = ""		#r2对象存储桶的名字

#[[send_email]]
#name = "email"			#CF发件, 配置后优先使用

[ai]
binding = "ai"

[assets]
binding = "assets"		#静态资源绑定名默认不可修改
directory = "./dist"	#前端vue项目打包的静态资源存放位置,默认dist
not_found_handling = "single-page-application"
run_worker_first = true

[triggers]
crons = ["0 16 * * *"]	#每天晚上12点执行每日任务,刷新分析缓存


[vars]
#ai_model = ""			#ai模型,不填默认使用@cf/meta/llama-3.1-8b-instruct
#analysis_cache = false			#是否开启分析数据缓存
#orm_log = false			#是否sql日志
domain = ["epomail.bond","epomail.cyou"]				#邮件域名可可配置多个 示例: ["example1.com","example2.com"]
admin = "admin@epomail.bond"				#管理员的邮箱	示例: admin@example.com
jwt_secret = "123456"			#jwt令牌的密钥,随便填一串字符串
totp_enc_key = "epomail-totp-encryption-master-key-32b"

[build]
command = "pnpm --prefix ../mail-vue install && pnpm --prefix ../mail-vue run build && pnpm --prefix ../temp_login_ui install && pnpm --prefix ../temp_login_ui run build && cp -r ../temp_login_ui/dist ./dist/login"
