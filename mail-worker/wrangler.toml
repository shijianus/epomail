name = "epomail"
main = "src/index.js"
compatibility_date = "2025-06-04"
keep_vars = true

[observability]
enabled = true

# --------------------------------------------------------------------------------------
# 数据库存储绑定 (D1 Databases Configuration)
# --------------------------------------------------------------------------------------
# 用户身份域 D1 数据库 (账号、密码、2FA、Passkeys、RBAC权限、OAuth开放平台)
[[d1_databases]]
binding = "USER_DB"
database_name = "epomail"
database_id = "542cbca1-fce5-41c5-93f2-c1d04fa919e8"

# 邮件业务域 D1 数据库 (邮件列表、邮件正文、收发邮箱号池、星标收藏、附件索引)
[[d1_databases]]
binding = "MAIL_DB"
database_name = "epomail"
database_id = "542cbca1-fce5-41c5-93f2-c1d04fa919e8"

# 基础默认 D1 绑定 (保障向下兼容)
[[d1_databases]]
binding = "db"
database_name = "epomail"
database_id = "542cbca1-fce5-41c5-93f2-c1d04fa919e8"

[[kv_namespaces]]
binding = "kv"
id = "e708c64d291e42c3a03b896914d42575"

#[[r2_buckets]]
#binding = "r2"			#r2对象存储绑定名默认不可修改
#bucket_name = ""		#r2对象存储桶的名字

#[[send_email]]
#name = "email"			#CF发件, 配置后优先使用

[ai]
binding = "ai"

[assets]
binding = "assets"		#静态资源绑定名默认不可修改
directory = "./dist"	#前端vue项目打包的静态资源存放位置,默认dist
not_found_handling = "single-page-application"
run_worker_first = true

[triggers]
crons = ["0 16 * * *", "*/5 * * * *"]	#每天夜间例行任务 + 每5分钟通知Outbox调度与租约检查


[vars]
#ai_model = ""			#ai模型,不填默认使用@cf/meta/llama-3.1-8b-instruct
#analysis_cache = false			#是否开启分析数据缓存
#orm_log = false			#是否sql日志
domain = ["epomail.bond","epomail.cyou"]				#邮件域名可可配置多个 示例: ["example1.com","example2.com"]
admin = "admin@epomail.bond"				#管理员的邮箱	示例: admin@example.com
#AVATAR_UPLOAD_URL = ""			#头像外部图床(可选)。不配置时头像落实例自有对象存储(KV)；配置示例: "https://img.example.com"
#CORS_ORIGINS = ""			#允许跨域访问 API 的前端源(逗号分隔)。留空时仅允许同源；OAuth token/userinfo 端点始终允许第三方调用。

# ⚠️ 安全约束：jwt_secret、totp_enc_key、admin_initial_password、init_secret、resend_webhook_secret、email_enc_key
# 均属机密变量，严禁写入本文件（本仓库为公开仓库，写入即泄漏）！
# 正确做法（Cloudflare Secrets，一次设置持久生效，部署不丢失）：
#   npx wrangler secret put jwt_secret
#   npx wrangler secret put totp_enc_key
#   npx wrangler secret put admin_initial_password   # 首次 /init 创建站长账号时必需
#   npx wrangler secret put init_secret              # 可选，不回退 jwt_secret
#   npx wrangler secret put resend_webhook_secret    # 使用 Resend Webhook 时必需
#   npx wrangler secret put email_enc_key            # 可选，建议与 totp_enc_key 分离
# 本地开发请在 mail-worker/.dev.vars 中配置（已被 .gitignore 排除，不会入库），模板参见 .dev.vars.example。
# 注意：/init 初始化门禁优先使用 init_secret，未配置时回退 jwt_secret；推荐使用 POST + x-init-secret 请求头。

[build]
# 顺序约束：temp_login_ui 必须先于 mail-vue 构建（详见 scripts/build-prod.mjs）。
# 使用 node ./build.mjs 使得无论在仓库根目录（--config mail-worker/wrangler.toml）还是在 mail-worker/ 目录下调用 wrangler，
# 均能无缝定位到统一构建流程并完成生产构建。
command = "node ./build.mjs"

# ======================================================================================
# 独立预发布环境 (Staging Environment Configuration)
# 调用方式示例 (等待用户授权后执行):
#   pnpm --dir mail-worker exec wrangler deploy --env staging
# ======================================================================================
[env.staging]
name = "epomail-staging"
compatibility_date = "2025-06-04"
keep_vars = true

[env.staging.observability]
enabled = true

# --------------------------------------------------------------------------------------
# Staging 独立 D1 数据库存储绑定 (严格物理隔离，禁止复用生产环境数据库)
# --------------------------------------------------------------------------------------
[[env.staging.d1_databases]]
binding = "USER_DB"
database_name = "epomail-staging-db"
database_id = "PLACEHOLDER_STAGING_D1_DATABASE_ID"

[[env.staging.d1_databases]]
binding = "MAIL_DB"
database_name = "epomail-staging-db"
database_id = "PLACEHOLDER_STAGING_D1_DATABASE_ID"

[[env.staging.d1_databases]]
binding = "db"
database_name = "epomail-staging-db"
database_id = "PLACEHOLDER_STAGING_D1_DATABASE_ID"

# --------------------------------------------------------------------------------------
# Staging 独立 KV 命名空间绑定 (严格物理隔离，禁止复用生产环境KV命名空间)
# --------------------------------------------------------------------------------------
[[env.staging.kv_namespaces]]
binding = "kv"
id = "PLACEHOLDER_STAGING_KV_NAMESPACE_ID"

# AI 绑定 (用于测试文本与规则智能研判)
[env.staging.ai]
binding = "ai"

# 静态资源绑定 (前端构建产物 dist 目录托管)
[env.staging.assets]
binding = "assets"
directory = "./dist"
not_found_handling = "single-page-application"
run_worker_first = true

# 定时调度 (夜间清理 + 每 5 分钟 Outbox 调度与租约检查)
[env.staging.triggers]
crons = ["0 16 * * *", "*/5 * * * *"]

# Staging 环境变量隔离配置
[env.staging.vars]
ENVIRONMENT = "staging"
ALLOW_URL_INIT = "false"
# 预发布域名与管理员配置（等待用户提供真实分配域名，使用显式占位符）
domain = ["PLACEHOLDER_STAGING_DOMAIN"]
admin = "admin@PLACEHOLDER_STAGING_DOMAIN"
# 邮件外发总开关 (第一阶段默认关闭，严防任意真实外发)
EMAIL_OUTBOUND_ENABLED = "false"
# 官方测试白名单 (第二阶段启用)
OUTBOUND_WHITELIST = "delivered@resend.dev,bounced@resend.dev,complained@resend.dev"

