name = "epomail-unit-test"
main = "src/index.js"
compatibility_date = "2025-03-10"
compatibility_flags = ["nodejs_als"]

[[d1_databases]]
binding = "db"
database_name = "epomail-unit-test"
database_id = "00000000-0000-4000-8000-000000000010"
remote = false

[[kv_namespaces]]
binding = "kv"
id = "00000000000000000000000000000010"
remote = false

[vars]
ENVIRONMENT = "test"
EMAIL_OUTBOUND_ENABLED = "false"
OUTBOUND_WHITELIST_ENFORCE = "true"
OUTBOUND_WHITELIST = ""
domain = ["example.com"]
admin = "admin@example.com"
jwt_secret = "test-jwt-secret-for-unit-tests"
totp_enc_key = "test-totp-encryption-key-for-unit-tests"
resend_webhook_secret = "local-test-only-webhook-secret"
