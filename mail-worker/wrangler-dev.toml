name = "epomail-dev"
main = "src/index.js"
compatibility_date = "2025-06-04"
compatibility_flags = ["nodejs_als"]
keep_vars = true

[observability]
enabled = true

[dev]
ip = "127.0.0.1"

[[d1_databases]]
binding = "db"
database_name = "epomail-local-development"
database_id = "00000000-0000-4000-8000-000000000001"
remote = false

[[kv_namespaces]]
binding = "kv"
id = "00000000000000000000000000000001"
remote = false

#[[r2_buckets]]
#binding = "r2"
#bucket_name = "email"

#[ai]
#binding = "ai"

[assets]
binding = "assets"
directory = "./dist"
not_found_handling = "single-page-application"
run_worker_first = true

#[[send_email]]
#name = "email"


[triggers]
crons = ["0 0 * * *", "*/5 * * * *"]

[vars]
DEV = "true"
ENVIRONMENT = "development"
EMAIL_OUTBOUND_ENABLED = "false"
OUTBOUND_WHITELIST_ENFORCE = "true"
OUTBOUND_WHITELIST = ""
ALLOW_URL_INIT = "false"
ai_model = ""
analysis_cache = false
orm_log = false
domain = ["example.com", "example2.com", "example3.com", "example4.com"]
admin = "admin@example.com"
# jwt_secret 已迁移至 .dev.vars（本地机密，不入库）；/init/<secret> 门禁使用其值
