<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>邮箱封禁管控 - 管理工作台</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eff6ff',
              500: '#3b82f6',
              600: '#2563eb',
              700: '#1d4ed8',
            },
            dark: {
              bg: '#090d16',
              surface: '#0f172a',
              card: '#131d33',
              border: '#1e293b',
              hover: '#1a2642'
            }
          },
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', '"Segoe UI"', 'Roboto', '"Helvetica Neue"', 'Arial', 'sans-serif'],
            mono: ['"JetBrains Mono"', '"Fira Code"', 'ui-monospace', 'monospace']
          }
        }
      }
    }
  </script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    /* 自定义美化滚动条与微交互 */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #090d16;
    }
    ::-webkit-scrollbar-thumb {
      background: #1e293b;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #334155;
    }
    .custom-tooltip {
      visibility: hidden;
      opacity: 0;
      transition: opacity 0.15s ease-in-out;
    }
    .has-tooltip:hover .custom-tooltip {
      visibility: visible;
      opacity: 1;
    }
  </style>
</head>
<body class="bg-dark-bg text-slate-100 min-h-screen font-sans antialiased selection:bg-blue-600 selection:text-white">

  <!-- 页面主容器 (宽屏自适应企业工作台) -->
  <div class="max-w-[1400px] mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-6">

    <!-- ==========================================
         页面顶栏：标题与轻量说明 (产品经理视角，低认知负荷)
         ========================================== -->
    <header class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 pb-2 border-b border-dark-border/60">
      <div class="space-y-1">
        <div class="flex items-center gap-3">
          <div class="p-2 rounded-lg bg-blue-500/10 text-blue-400 border border-blue-500/20">
            <i data-lucide="shield-alert" class="w-5 h-5"></i>
          </div>
          <h1 class="text-xl font-bold tracking-tight text-white flex items-center gap-2">
            邮箱封禁管控
            <span class="text-xs px-2 py-0.5 rounded-full font-mono font-medium bg-rose-500/10 text-rose-400 border border-rose-500/20">
              Live Control
            </span>
          </h1>
        </div>
        <p class="text-xs text-slate-400 pl-11">
          管控全站高危、恶意与异常外发邮件主体，提供实时熔断处置、人工复核与快速解封流水
        </p>
      </div>
      
      <!-- 快捷全局功能 -->
      <div class="flex items-center gap-2.5">
        <button onclick="openManualBanModal()" class="inline-flex items-center gap-1.5 px-3 py-1.5 text-xs font-medium text-white bg-blue-600 hover:bg-blue-500 active:bg-blue-700 rounded-lg shadow-sm shadow-blue-900/40 transition">
          <i data-lucide="user-x" class="w-3.5 h-3.5"></i>
          <span>手工添加封禁</span>
        </button>
        <button onclick="exportData()" class="inline-flex items-center gap-1.5 px-3 py-1.5 text-xs font-medium text-slate-300 bg-dark-card hover:bg-dark-hover active:bg-dark-border border border-dark-border rounded-lg transition">
          <i data-lucide="download" class="w-3.5 h-3.5"></i>
          <span>导出列表</span>
        </button>
      </div>
    </header>

    <!-- ========================================================
         1. 顶部统计卡片精简与重构 (4 个真正有用的指标卡片，支持联动筛选)
         【对接提示】可从后端 /api/audit/stat 统计接口实时绑定数据
         ======================================================== -->
    <section class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4" id="kpiCardsContainer">
      
      <!-- 卡片 1: 生效中封禁 (默认高亮选中态) -->
      <div onclick="selectKpiFilter('banned')" id="card-banned"
        class="kpi-card cursor-pointer relative p-4 rounded-xl bg-dark-card border border-blue-500/60 ring-1 ring-blue-500/50 shadow-lg shadow-blue-950/20 transition-all hover:translate-y-[-1px]">
        <div class="flex items-center justify-between">
          <span class="text-xs font-medium text-slate-400">生效中封禁</span>
          <span class="p-1.5 rounded-lg bg-rose-500/10 text-rose-400 border border-rose-500/20">
            <i data-lucide="ban" class="w-4 h-4"></i>
          </span>
        </div>
        <div class="mt-3 flex items-baseline gap-2">
          <span class="text-2xl font-bold font-mono tracking-tight text-white" id="stat-banned-count">2</span>
          <span class="text-xs font-medium text-rose-400 flex items-center">
            <i data-lucide="activity" class="w-3 h-3 mr-0.5 inline"></i> 阻断中
          </span>
        </div>
        <p class="mt-2 text-xs text-slate-400 truncate">策略生效中 · 阻断全部外发</p>
        <!-- 激活指示小圆点 -->
        <span class="kpi-dot absolute top-3 right-3 w-1.5 h-1.5 rounded-full bg-blue-400 animate-pulse"></span>
      </div>

      <!-- 卡片 2: 今日新增 -->
      <div onclick="selectKpiFilter('today')" id="card-today"
        class="kpi-card cursor-pointer relative p-4 rounded-xl bg-dark-card border border-dark-border transition-all hover:border-slate-600 hover:translate-y-[-1px]">
        <div class="flex items-center justify-between">
          <span class="text-xs font-medium text-slate-400">今日新增</span>
          <span class="p-1.5 rounded-lg bg-blue-500/10 text-blue-400 border border-blue-500/20">
            <i data-lucide="user-plus" class="w-4 h-4"></i>
          </span>
        </div>
        <div class="mt-3 flex items-baseline gap-2">
          <span class="text-2xl font-bold font-mono tracking-tight text-white" id="stat-today-count">2</span>
          <span class="text-xs text-slate-400">近 24 小时</span>
        </div>
        <p class="mt-2 text-xs text-slate-400 truncate">近24小时新增处置</p>
        <span class="kpi-dot hidden absolute top-3 right-3 w-1.5 h-1.5 rounded-full bg-blue-400"></span>
      </div>

      <!-- 卡片 3: 待人工复核 -->
      <div onclick="selectKpiFilter('pending')" id="card-pending"
        class="kpi-card cursor-pointer relative p-4 rounded-xl bg-dark-card border border-dark-border transition-all hover:border-slate-600 hover:translate-y-[-1px]">
        <div class="flex items-center justify-between">
          <span class="text-xs font-medium text-slate-400">待人工复核</span>
          <span class="p-1.5 rounded-lg bg-amber-500/10 text-amber-400 border border-amber-500/20">
            <i data-lucide="clock" class="w-4 h-4"></i>
          </span>
        </div>
        <div class="mt-3 flex items-baseline gap-2">
          <span class="text-2xl font-bold font-mono tracking-tight text-white" id="stat-pending-count">1</span>
          <span class="text-xs font-medium text-amber-400">待运营处理</span>
        </div>
        <p class="mt-2 text-xs text-slate-400 truncate">申诉待复核</p>
        <span class="kpi-dot hidden absolute top-3 right-3 w-1.5 h-1.5 rounded-full bg-blue-400"></span>
      </div>

      <!-- 卡片 4: 高风险邮箱 -->
      <div onclick="selectKpiFilter('highrisk')" id="card-highrisk"
        class="kpi-card cursor-pointer relative p-4 rounded-xl bg-dark-card border border-dark-border transition-all hover:border-slate-600 hover:translate-y-[-1px]">
        <div class="flex items-center justify-between">
          <span class="text-xs font-medium text-slate-400">高风险邮箱</span>
          <span class="p-1.5 rounded-lg bg-red-500/10 text-red-400 border border-red-500/20">
            <i data-lucide="alert-triangle" class="w-4 h-4"></i>
          </span>
        </div>
        <div class="mt-3 flex items-baseline gap-2">
          <span class="text-2xl font-bold font-mono tracking-tight text-white" id="stat-highrisk-count">2</span>
          <span class="text-xs text-slate-400">已列入观察</span>
        </div>
        <p class="mt-2 text-xs text-slate-400 truncate">撞库/黑名单探测</p>
        <span class="kpi-dot hidden absolute top-3 right-3 w-1.5 h-1.5 rounded-full bg-blue-400"></span>
      </div>

    </section>

    <!-- ========================================================
         2. 筛选栏优化 (紧凑布局，搜索框、状态、时间、风险等级与操作按钮)
         ======================================================== -->
    <section class="bg-dark-card border border-dark-border rounded-xl p-3.5 space-y-3">
      <div class="flex flex-col lg:flex-row lg:items-center justify-between gap-3">
        
        <!-- 左侧输入与下拉条件组合 -->
        <div class="flex flex-wrap items-center gap-2.5 flex-1">
          
          <!-- 搜索框 (占位符按要求优化，支持快捷回车与清空) -->
          <div class="relative min-w-[260px] sm:w-72">
            <i data-lucide="search" class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
            <input 
              id="filterKeyword" 
              type="text" 
              placeholder="搜索邮箱、案件编号或关键字..."
              onkeyup="if(event.key === 'Enter') handleSearch()"
              class="w-full bg-dark-bg/80 border border-dark-border focus:border-blue-500 focus:ring-1 focus:ring-blue-500 text-xs text-white rounded-lg pl-9 pr-8 py-2 placeholder-slate-500 transition outline-none"
            />
            <button onclick="clearKeyword()" id="clearKeywordBtn" class="hidden absolute right-2.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-white">
              <i data-lucide="x" class="w-3.5 h-3.5"></i>
            </button>
          </div>

          <!-- 下拉 1: 状态筛选 (全部 / 生效中 / 已解封 / 待复核) -->
          <div class="w-32">
            <select id="filterStatus" onchange="handleSearch()" class="w-full bg-dark-bg/80 border border-dark-border focus:border-blue-500 text-xs text-slate-200 rounded-lg px-2.5 py-2 outline-none cursor-pointer transition">
              <option value="all">状态：全部</option>
              <option value="banned">生效中</option>
              <option value="pending">待复核</option>
              <option value="unbanned">已解封</option>
              <option value="watching">观察中</option>
            </select>
          </div>

          <!-- 下拉 2: 时间范围 (全部 / 今日 / 近7天 / 近30天) -->
          <div class="w-32">
            <select id="filterTimeRange" onchange="handleSearch()" class="w-full bg-dark-bg/80 border border-dark-border focus:border-blue-500 text-xs text-slate-200 rounded-lg px-2.5 py-2 outline-none cursor-pointer transition">
              <option value="all">时间：全部</option>
              <option value="today">今日</option>
              <option value="7days">近 7 天</option>
              <option value="30days">近 30 天</option>
            </select>
          </div>

          <!-- 下拉 3: 风险等级 (全部 / 高 / 中 / 低) -->
          <div class="w-32">
            <select id="filterRiskLevel" onchange="handleSearch()" class="w-full bg-dark-bg/80 border border-dark-border focus:border-blue-500 text-xs text-slate-200 rounded-lg px-2.5 py-2 outline-none cursor-pointer transition">
              <option value="all">风险：全部</option>
              <option value="high">高风险</option>
              <option value="medium">中风险</option>
              <option value="low">低风险</option>
            </select>
          </div>

        </div>

        <!-- 右侧动作按钮组 (搜索、刷新、重置，紧凑图标/文字) -->
        <div class="flex items-center gap-2 self-end lg:self-auto">
          <!-- 搜索按钮 -->
          <button onclick="handleSearch()" class="inline-flex items-center gap-1.5 px-3 py-1.5 text-xs font-medium text-white bg-blue-600 hover:bg-blue-500 active:bg-blue-700 rounded-lg transition shadow-sm">
            <i data-lucide="search" class="w-3.5 h-3.5"></i>
            <span>搜索</span>
          </button>

          <!-- 刷新按钮 -->
          <button onclick="handleRefresh()" title="刷新数据" class="p-2 text-slate-300 hover:text-white bg-dark-bg hover:bg-dark-border border border-dark-border rounded-lg transition">
            <i data-lucide="refresh-cw" id="refreshIcon" class="w-3.5 h-3.5"></i>
          </button>

          <!-- 重置按钮 -->
          <button onclick="handleReset()" title="重置筛选条件" class="p-2 text-slate-300 hover:text-white bg-dark-bg hover:bg-dark-border border border-dark-border rounded-lg transition">
            <i data-lucide="rotate-ccw" class="w-3.5 h-3.5"></i>
          </button>
        </div>

      </div>
    </section>

    <!-- ========================================================
         3. 表格列重构 (主列为邮箱，醒目状态标签，纯文本不打底，人体工学操作)
         ======================================================== -->
    <section class="bg-dark-card border border-dark-border rounded-xl overflow-hidden shadow-xl">
      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse table-auto" id="bannedTable">
          <thead>
            <tr class="border-b border-dark-border bg-dark-surface/90 text-xs font-semibold text-slate-400 whitespace-nowrap">
              <!-- 列 1: 邮箱 (主列) -->
              <th scope="col" class="py-3.5 px-4 w-[230px]">邮箱账号</th>
              <!-- 列 2: 当前状态 -->
              <th scope="col" class="py-3.5 px-3 w-[125px]">当前状态</th>
              <!-- 列 3: 封禁原因 (截断 + Tooltip) -->
              <th scope="col" class="py-3.5 px-3 min-w-[200px]">封禁原因 / 触发规则</th>
              <!-- 列 4: 封禁时间 -->
              <th scope="col" class="py-3.5 px-3 w-[130px]">封禁时间</th>
              <!-- 列 5: 最后处理时间 -->
              <th scope="col" class="py-3.5 px-3 w-[130px]">最后处理时间</th>
              <!-- 列 6: 处理人 / 负责人 (新增列) -->
              <th scope="col" class="py-3.5 px-3 w-[135px]">处理人 / 负责人</th>
              <!-- 列 7: 操作 (右对齐按钮组) -->
              <th scope="col" class="py-3.5 px-4 w-[200px] text-right">快捷操作</th>
            </tr>
          </thead>
          <tbody class="divide-y divide-dark-border/60 text-xs text-slate-200" id="tableBody">
            <!-- 由 renderTable() 动态渲染，以下预设初始结构与模拟数据 -->
          </tbody>
        </table>
      </div>

      <!-- ========================================================
           5. 底部保留分页信息 (如要求：共 X 条，15条/页)
           ======================================================== -->
      <footer class="flex flex-col sm:flex-row items-center justify-between gap-3 px-4 py-3 border-t border-dark-border bg-dark-surface/60 text-xs text-slate-400">
        <div class="flex items-center gap-2">
          <span>共 <strong class="text-slate-200 font-mono" id="paginationTotal">5</strong> 条数据</span>
          <span class="text-slate-600">|</span>
          <span class="text-slate-400">15 条/页</span>
        </div>
        <div class="flex items-center gap-1.5 font-mono">
          <button class="px-2.5 py-1 text-slate-500 hover:text-slate-300 bg-dark-bg border border-dark-border rounded cursor-not-allowed" disabled>
            <i data-lucide="chevron-left" class="w-3.5 h-3.5"></i>
          </button>
          <button class="px-3 py-1 bg-blue-600 text-white font-semibold rounded shadow-sm">1</button>
          <button class="px-2.5 py-1 text-slate-500 hover:text-slate-300 bg-dark-bg border border-dark-border rounded cursor-not-allowed" disabled>
            <i data-lucide="chevron-right" class="w-3.5 h-3.5"></i>
          </button>
        </div>
      </footer>
    </section>

  </div>

  <!-- ========================================================
       4. 侧边抽屉：案件与封禁详情 (Side Drawer)
       ======================================================== -->
  <div id="drawerOverlay" onclick="closeDrawer()" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-40 hidden transition-opacity"></div>
  <aside id="detailDrawer" class="fixed top-0 right-0 h-full w-full sm:w-[480px] bg-dark-surface border-l border-dark-border z-50 transform translate-x-full transition-transform duration-300 flex flex-col shadow-2xl">
    <!-- 抽屉头部 -->
    <div class="p-4 border-b border-dark-border flex items-center justify-between bg-dark-card/50">
      <div class="flex items-center gap-2">
        <div class="p-1.5 rounded-lg bg-blue-500/10 text-blue-400">
          <i data-lucide="file-text" class="w-4 h-4"></i>
        </div>
        <span class="font-bold text-sm text-white">封禁台账 · 存证（只读）</span>
      </div>
      <button onclick="closeDrawer()" class="p-1 rounded-md text-slate-400 hover:text-white hover:bg-dark-border transition">
        <i data-lucide="x" class="w-4 h-4"></i>
      </button>
    </div>

    <!-- 抽屉主体 -->
    <div class="p-5 flex-1 overflow-y-auto space-y-5 text-xs" id="drawerBody">
      <!-- 动态插入内容 -->
    </div>

    <!-- 抽屉底栏动作 -->
    <div class="p-4 border-t border-dark-border bg-dark-card/60 flex items-center justify-end gap-2.5" id="drawerFooter">
      <button onclick="closeDrawer()" class="px-3 py-1.5 text-xs text-slate-300 bg-dark-bg hover:bg-dark-border border border-dark-border rounded-lg transition">关闭</button>
      <button id="drawerPrimaryAction" class="px-3 py-1.5 text-xs font-medium text-white bg-blue-600 hover:bg-blue-500 rounded-lg transition">执行快速处置</button>
    </div>
  </aside>

  <!-- ========================================================
       轻量确认与备注弹窗 (Modal)
       ======================================================== -->
  <div id="actionModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-dark-surface border border-dark-border rounded-xl w-full max-w-md p-5 space-y-4 shadow-2xl">
      <div class="flex items-center justify-between border-b border-dark-border pb-3">
        <h3 class="text-sm font-semibold text-white flex items-center gap-2" id="modalTitle">操作提示</h3>
        <button onclick="closeModal()" class="text-slate-400 hover:text-white">
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
      </div>
      <div id="modalContent" class="text-xs text-slate-300 space-y-3">
        <!-- 弹窗表单或提示 -->
      </div>
      <div class="flex justify-end gap-2 pt-2">
        <button onclick="closeModal()" class="px-3 py-1.5 text-xs text-slate-300 bg-dark-bg border border-dark-border rounded-lg hover:bg-dark-border transition">取消</button>
        <button id="modalConfirmBtn" class="px-3 py-1.5 text-xs font-medium text-white bg-blue-600 hover:bg-blue-500 rounded-lg transition">确认</button>
      </div>
    </div>
  </div>

  <!-- 轻量 Toast 提示 -->
  <div id="toast" class="fixed bottom-6 right-6 z-50 transform translate-y-10 opacity-0 transition-all duration-300 pointer-events-none flex items-center gap-2 px-3.5 py-2.5 rounded-lg text-xs font-medium bg-dark-card border border-dark-border text-white shadow-xl">
    <i data-lucide="info" id="toastIcon" class="w-4 h-4 text-blue-400"></i>
    <span id="toastMsg">通知信息</span>
  </div>

  <!-- ========================================================
       核心脚本：数据源、筛选逻辑、视图渲染与交互绑定
       【提示】以下 mockData 为预置数据，真实对接时从后端 API 拉取
       ======================================================== -->

    // 4. 数据筛选过滤引擎
    function getFilteredData() {
      return mockData.filter(item => {
        // 关键字过滤
        if (currentFilter.keyword) {
          const kw = currentFilter.keyword.toLowerCase();
          const matchEmail = item.email.toLowerCase().includes(kw);
          const matchTicket = item.ticketId.toLowerCase().includes(kw);
          const matchReason = item.banReason.toLowerCase().includes(kw);
          const matchOperator = item.operator.toLowerCase().includes(kw);
          if (!matchEmail && !matchTicket && !matchReason && !matchOperator) return false;
        }

        // 状态过滤
        if (currentFilter.status !== 'all') {
          if (item.status !== currentFilter.status) return false;
        }

        // 风险等级过滤
        if (currentFilter.riskLevel !== 'all') {
          if (item.riskLevel !== currentFilter.riskLevel) return false;
        }

        // 时间过滤 (模拟简单日期匹配)
        if (currentFilter.timeRange === 'today') {
          if (!item.banTime.startsWith('2026-10-07') && !item.banTime.startsWith('2026-10-06')) {
            // 宽泛匹配 24h
            return false;
          }
        }

        return true;
      });
    }

    // 5. 顶部统计卡片高亮与联动逻辑

      currentFilter.kpiActive = type;

      document.querySelectorAll('.kpi-card').forEach(card => {
        card.classList.remove('border-blue-500/60', 'ring-1', 'ring-blue-500/50', 'shadow-blue-950/20');
        card.classList.add('border-dark-border');
        card.querySelector('.kpi-dot')?.classList.add('hidden');
      });

      const activeCard = document.getElementById(`card-${type}`);
      if (activeCard) {
        activeCard.classList.remove('border-dark-border');
        activeCard.classList.add('border-blue-500/60', 'ring-1', 'ring-blue-500/50', 'shadow-blue-950/20');
        activeCard.querySelector('.kpi-dot')?.classList.remove('hidden');
      }

      // 联动下拉框
      const statusSelect = document.getElementById('filterStatus');
      const riskSelect = document.getElementById('filterRiskLevel');
      const timeSelect = document.getElementById('filterTimeRange');

      if (type === 'banned') {
        statusSelect.value = 'banned';
        currentFilter.status = 'banned';
      } else if (type === 'pending') {
        statusSelect.value = 'pending';
        currentFilter.status = 'pending';
      } else if (type === 'highrisk') {
        riskSelect.value = 'high';
        currentFilter.riskLevel = 'high';
      } else if (type === 'today') {
        timeSelect.value = 'today';
        currentFilter.timeRange = 'today';
      }

      renderTable();
      showToast(`已切换至「${type}」卡片过滤模式`);
    }

              <div>
                <label class="block text-slate-400 mb-1">处置模式</label>
                <select id="modalInputMode" class="w-full bg-dark-bg border border-dark-border rounded-lg p-2 text-xs text-white outline-none">
                  <option value="banned">立即阻断外发</option>
                  <option value="watching">列入观察队列</option>
                </select>
              </div>
            </div>
          </div>
        `,
        confirmText: '确认添加并生效',
        confirmClass: 'bg-blue-600 hover:bg-blue-500',
        onConfirm: () => {
          const email = document.getElementById('modalInputEmail').value.trim();
          const reason = document.getElementById('modalInputReason').value.trim();
          const risk = document.getElementById('modalInputRisk').value;
          const mode = document.getElementById('modalInputMode').value;

          if (!email || !reason) {
            alert('请完整填写邮箱与封禁原因');
            return;
          }

          mockData.unshift({
            id: Date.now(),
            ticketId: 'TKT-2026-MAN' + Math.floor(1000 + Math.random() * 9000),
            email: email,
            status: mode,
            statusLabel: mode === 'banned' ? '生效中-已封禁' : '观察中',
            riskLevel: risk,
            riskLabel: risk === 'high' ? '高风险' : (risk === 'medium' ? '中风险' : '低风险'),
            banReason: reason,
            banTime: '2026-10-07 09:30',
            lastProcessTime: '2026-10-07 09:30',
            operator: '管理员 / 当前登录用户',
            operatorRole: '安全运维',
            notes: '人工手工添加',
            history: [{ time: '2026-10-07 09:30', text: '人工手工添加封禁管控' }]
          });

          closeModal();
          renderTable();
          showToast(`已成功录入封禁: ${email}`);
        }
      });
    }

    // 8. 侧边抽屉逻辑 (查看详情)
    function openDetailDrawer(id) {
      const item = mockData.find(row => row.id === id);
      if (!item) return;

      const drawer = document.getElementById('detailDrawer');
      const overlay = document.getElementById('drawerOverlay');
      const body = document.getElementById('drawerBody');

      body.innerHTML = `
        <!-- 核心状态卡片 -->
        <div class="p-4 rounded-xl bg-dark-card border border-dark-border space-y-3">
          <div class="flex items-center justify-between">
            <span class="font-mono text-slate-400">案件编号: ${item.ticketId}</span>
            ${renderStatusBadge(item.status)}
          </div>
          <div class="space-y-1">
            <span class="text-slate-400 text-[11px]">审计对象 (邮箱账号)</span>
            <div class="font-mono font-bold text-sm text-white flex items-center justify-between">
              <span>${item.email}</span>
              <button onclick="copyToClipboard('${item.email}', '邮箱已复制')" class="text-slate-400 hover:text-white">
                <i data-lucide="copy" class="w-3.5 h-3.5"></i>
              </button>
            </div>
          </div>
          <div class="flex items-center gap-2 pt-1">
            <span class="text-[11px] text-slate-400">风险等级：</span>
            ${renderRiskBadge(item.riskLevel)}
          </div>
        </div>

        <!-- 详细规则与原因 -->
        <div class="space-y-1.5">
          <label class="text-slate-400 font-medium">封禁原因与规则特征</label>
          <div class="p-3 rounded-lg bg-dark-bg border border-dark-border text-slate-200 leading-relaxed font-sans">
            ${item.banReason}
          </div>
        </div>

        <!-- 关键时间与负责人元数据 -->
        <div class="grid grid-cols-2 gap-3">
          <div class="p-3 rounded-lg bg-dark-card border border-dark-border space-y-1">
            <span class="text-slate-500 text-[10px]">首次封禁时间</span>
            <div class="font-mono text-slate-300 font-medium">${item.banTime}</div>
          </div>
          <div class="p-3 rounded-lg bg-dark-card border border-dark-border space-y-1">
            <span class="text-slate-500 text-[10px]">最后处理时间</span>
            <div class="font-mono text-slate-300 font-medium">${item.lastProcessTime}</div>
          </div>
          <div class="p-3 rounded-lg bg-dark-card border border-dark-border space-y-1">
            <span class="text-slate-500 text-[10px]">当前处理人</span>
            <div class="text-slate-300 font-medium">${item.operator}</div>
          </div>
          <div class="p-3 rounded-lg bg-dark-card border border-dark-border space-y-1">
            <span class="text-slate-500 text-[10px]">处置角色</span>
            <div class="text-slate-300 font-medium">${item.operatorRole}</div>
          </div>
        </div>

        <!-- 内部审计备忘 -->
        <div class="space-y-1.5">
          <div class="flex items-center justify-between">
            <label class="text-slate-400 font-medium">内部备忘录</label>
            <button onclick="handleNote(${item.id})" class="text-[11px] text-blue-400 hover:text-blue-300">编辑</button>
          </div>
          <div class="p-3 rounded-lg bg-dark-bg border border-dark-border text-slate-300">
            ${item.notes || '暂无备忘信息'}
          </div>
        </div>

        <!-- 处理时间线 -->
        <div class="space-y-2">
          <label class="text-slate-400 font-medium">流转时间线</label>
          <div class="border-l-2 border-dark-border pl-3 space-y-3 py-1">
            ${(item.history || []).map(h => `
              <div class="relative">
                <span class="absolute -left-[19px] top-1 w-2 h-2 rounded-full bg-blue-500 ring-2 ring-dark-surface"></span>
                <div class="font-mono text-[10px] text-slate-500">${h.time}</div>
                <div class="text-slate-300 mt-0.5">${h.text}</div>
              </div>
            `).join('')}
          </div>
        </div>
      `;

      // 绑定底栏主按钮 (与表格行内完全一致：解封 / 重新封禁)
      const primaryBtn = document.getElementById('drawerPrimaryAction');
      if (item.status === 'banned') {
        primaryBtn.className = 'px-3 py-1.5 text-xs font-medium text-white bg-emerald-600 hover:bg-emerald-500 rounded-lg transition';
        primaryBtn.innerText = '解封';
        primaryBtn.onclick = () => { closeDrawer(); handleUnban(item.id); };
      } else {
        primaryBtn.className = 'px-3 py-1.5 text-xs font-medium text-white bg-rose-600 hover:bg-rose-500 rounded-lg transition';
        primaryBtn.innerText = '重新封禁';
        primaryBtn.onclick = () => { closeDrawer(); handleReban(item.id); };
      }

      overlay.classList.remove('hidden');
      drawer.classList.remove('translate-x-full');
      lucide.createIcons();
    }

    function closeDrawer() {
      const drawer = document.getElementById('detailDrawer');
      const overlay = document.getElementById('drawerOverlay');
      drawer.classList.add('translate-x-full');
      overlay.classList.add('hidden');
    }

    // 9. 通用 Modal 逻辑
    let currentModalConfirm = null;
    function openModal({ title, content, confirmText = '确认', confirmClass = 'bg-blue-600 hover:bg-blue-500', onConfirm }) {
      document.getElementById('modalTitle').innerText = title;
      document.getElementById('modalContent').innerHTML = content;
      const btn = document.getElementById('modalConfirmBtn');
      btn.innerText = confirmText;
      btn.className = `px-3 py-1.5 text-xs font-medium text-white rounded-lg transition ${confirmClass}`;
      currentModalConfirm = onConfirm;
      btn.onclick = () => { if (currentModalConfirm) currentModalConfirm(); };
      document.getElementById('actionModal').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('actionModal').classList.add('hidden');
      currentModalConfirm = null;
    }

    // 10. 辅助函数：剪贴板复制、Toast 与导出
    function copyToClipboard(text, message) {
      navigator.clipboard.writeText(text).then(() => {
        showToast(message || '已成功复制到剪贴板', 'check');
      }).catch(() => {
        showToast('复制失败，请手动选取', 'alert-circle');
      });
    }

    function showToast(message, icon = 'info') {
      const toast = document.getElementById('toast');
      const toastMsg = document.getElementById('toastMsg');
      const toastIcon = document.getElementById('toastIcon');

      toastMsg.innerText = message;
      toastIcon.setAttribute('data-lucide', icon);
      lucide.createIcons();

      toast.classList.remove('translate-y-10', 'opacity-0');
      toast.classList.add('translate-y-0', 'opacity-100');

      setTimeout(() => {
        toast.classList.remove('translate-y-0', 'opacity-100');
        toast.classList.add('translate-y-10', 'opacity-0');
      }, 2500);
    }

    function exportData() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(mockData, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", `email_ban_export_${Date.now()}.json`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
      showToast('封禁管控数据已导出为 JSON 文件', 'download');
    }

    // 初始化页面渲染
    window.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
      renderTable();
    });
  </script>
</body>
</html>
